<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dyno</title>
    <style>
      body {
        margin: 0;
        background: #f9f9f7;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0d0d0d;
        }
      }
      .app {
        font:
          13px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        max-width: 1180px;
        margin: 0 auto;
        padding: 16px 24px 40px;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      h1 .tagline {
        font-size: 13px;
        font-weight: normal;
        color: var(--muted);
        margin-left: 6px;
      }
      .explorer .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin: 6px 0;
      }
      .explorer .segmented {
        display: inline-flex;
        border: 1px solid var(--grid);
        border-radius: 6px;
        overflow: hidden;
      }
      .explorer .segmented button {
        border: 0;
        border-radius: 0;
        margin: 0;
      }
      .explorer .segmented button[aria-checked="true"] {
        background: var(--ink);
        color: var(--surface);
      }
      .explorer .check {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .explorer .readout,
      .explorer .scrub output {
        font-variant-numeric: tabular-nums;
        color: var(--ink-2);
      }
      .explorer .scrub {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 6px 0;
      }
      .explorer .scrub[hidden] {
        display: none;
      }
      .explorer .scrub input {
        flex: 1;
      }
      .explorer .scrub output {
        min-width: 6ch;
      }
      .explorer .status.error {
        color: var(--critical);
      }
      .explorer .panes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 10px;
        margin-top: 8px;
      }
      .explorer .pane {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #000;
        border: 1px solid var(--grid);
        border-radius: 6px;
        overflow: hidden;
      }
      .explorer .pane .view {
        position: absolute;
        inset: 0;
      }
      .explorer .hud {
        position: absolute;
        left: 8px;
        top: 8px;
        background: rgba(13, 13, 13, 0.78);
        border: 1px solid #383835;
        border-radius: 6px;
        padding: 6px 9px;
        font:
          12px/1.4 ui-monospace,
          monospace;
        color: #c3c2b7;
        pointer-events: none;
        white-space: pre;
      }
      .explorer .hud b {
        color: #f0efec;
      }
      .explorer .hud .key {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 6px;
        vertical-align: -1px;
      }
      .explorer .hint,
      .explorer .credits {
        color: var(--muted);
        font-size: 12px;
      }
      nav {
        display: flex;
        gap: 4px;
      }
      nav button {
        background: none;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 4px 10px;
        color: var(--ink-2);
        font: inherit;
        cursor: pointer;
      }
      nav button[aria-selected="true"] {
        border-color: var(--grid);
        background: var(--surface);
        color: var(--ink);
        font-weight: 600;
      }
      .where {
        color: var(--muted);
        font-size: 12px;
        margin: 4px 0 12px;
      }
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin: 8px 0 12px;
        color: var(--ink-2);
      }
      select,
      input[type="text"] {
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--grid);
        border-radius: 6px;
        padding: 3px 8px;
        font: inherit;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid var(--grid);
        border-radius: 999px;
        padding: 2px 10px;
        background: var(--surface);
        cursor: pointer;
        user-select: none;
        color: var(--ink-2);
      }
      .chip[aria-pressed="true"] {
        color: var(--ink);
        border-color: var(--ink-2);
        font-weight: 600;
      }
      table.log {
        border-collapse: collapse;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--grid);
        border-radius: 8px;
        font-variant-numeric: tabular-nums;
      }
      table.log th,
      table.log td {
        padding: 6px 10px;
        border-bottom: 1px solid var(--grid);
        text-align: left;
        vertical-align: top;
      }
      table.log th {
        color: var(--ink-2);
        font-weight: normal;
      }
      table.log td.num {
        text-align: right;
      }
      .muted {
        color: var(--muted);
      }
      .better {
        color: var(--good-text);
      }
      .worse {
        color: var(--critical);
      }
      iframe {
        width: 100%;
        height: calc(100vh - 150px);
        border: 1px solid var(--grid);
        border-radius: 8px;
        background: var(--surface);
      }
      .empty {
        color: var(--muted);
        padding: 24px;
        background: var(--surface);
        border: 1px dashed var(--grid);
        border-radius: 8px;
      }
      button.link {
        background: none;
        border: none;
        color: var(--series-1);
        cursor: pointer;
        font: inherit;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div class="app viz">
      <header>
        <h1>
          Dyno <span class="tagline">benchmark tracking for CesiumJS</span>
        </h1>
        <nav>
          <button data-tab="trends">Trends</button>
          <button data-tab="log">Runs</button>
          <button data-tab="compare">Compare</button>
          <button data-tab="report">Report</button>
          <button data-tab="explore">Explorer</button>
        </nav>
      </header>
      <div class="where" id="where"></div>
      <main id="main"></main>
    </div>
    <script type="module" src="./results.ts"></script>
  </body>
</html>
