<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Benchmark Results</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #0b0e14;
        color: #d7dce6;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      p {
        color: #8a93a6;
        max-width: 900px;
      }
      select {
        background: #151a24;
        color: #d7dce6;
        border: 1px solid #2a3346;
        border-radius: 6px;
        padding: 4px 8px;
        font: inherit;
      }
      iframe {
        width: 100%;
        height: calc(100vh - 140px);
        border: 1px solid #222a3a;
        border-radius: 6px;
        margin-top: 8px;
        background: #0b0e14;
      }
    </style>
  </head>
  <body>
    <h1>Benchmark results</h1>
    <p id="where"></p>
    <label
      >Run
      <select id="run"></select
    ></label>
    <iframe id="report" title="Report"></iframe>
    <script type="module" src="./results.ts"></script>
  </body>
</html>
