<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dyno</title>
    <style>
      body {
        margin: 0;
        background: #f9f9f7;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0d0d0d;
        }
      }
      .app {
        font:
          13px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        max-width: 1480px;
        margin: 0 auto;
        padding: 16px 24px 40px;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      h1 .tagline {
        font-size: 13px;
        font-weight: normal;
        color: var(--muted);
        margin-left: 6px;
      }
      .explorer .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin: 6px 0;
      }
      .explorer .segmented {
        display: inline-flex;
        border: 1px solid var(--grid);
        border-radius: 6px;
        overflow: hidden;
      }
      .explorer .segmented button {
        border: 0;
        border-radius: 0;
        margin: 0;
      }
      .explorer .segmented button[aria-checked="true"] {
        background: var(--ink);
        color: var(--surface);
      }
      .explorer .check {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .explorer .readout,
      .explorer .scrub output {
        font-variant-numeric: tabular-nums;
        color: var(--ink-2);
      }
      .explorer .scrub {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 6px 0;
      }
      .explorer .scrub[hidden] {
        display: none;
      }
      .explorer .scrub input {
        flex: 1;
      }
      .explorer .scrub output {
        min-width: 6ch;
      }
      .explorer .status.error {
        color: var(--critical);
      }
      .explorer .panes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 10px;
        margin-top: 8px;
      }
      .explorer .pane {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #000;
        border: 1px solid var(--grid);
        border-radius: 6px;
        overflow: hidden;
      }
      .explorer .pane .view {
        position: absolute;
        inset: 0;
      }
      .explorer .hud {
        position: absolute;
        left: 8px;
        top: 8px;
        background: rgba(13, 13, 13, 0.78);
        border: 1px solid #383835;
        border-radius: 6px;
        padding: 6px 9px;
        font:
          12px/1.4 ui-monospace,
          monospace;
        color: #c3c2b7;
        pointer-events: none;
        white-space: pre;
      }
      .explorer .hud b {
        color: #f0efec;
      }
      .explorer .hud .key {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 6px;
        vertical-align: -1px;
      }
      .explorer .measure {
        background: var(--surface);
        border: 1px solid var(--grid);
        border-radius: 8px;
        padding: 8px 12px;
        margin: 8px 0;
      }
      .explorer .measure pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .explorer .hint,
      .explorer .credits {
        color: var(--muted);
        font-size: 12px;
      }
      .workspace {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      @media (max-width: 860px) {
        .workspace {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .workspace .runs {
        position: sticky;
        top: 8px;
        max-height: calc(100vh - 24px);
        overflow: auto;
        background: var(--surface);
        border: 1px solid var(--grid);
        border-radius: 8px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .workspace .runs input[type="search"] {
        width: 100%;
        box-sizing: border-box;
      }
      .workspace .run-actions {
        display: flex;
        gap: 6px;
      }
      .workspace .runs ol {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
      }
      .workspace .runs li {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr) 22px;
        gap: 4px;
        align-items: start;
        padding: 6px 2px;
        border-top: 1px solid var(--grid);
        font-size: 12px;
      }
      .workspace .runs li.off .run-text {
        opacity: 0.45;
      }
      .workspace .run-text {
        cursor: pointer;
        overflow-wrap: anywhere;
      }
      .workspace .pin {
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
        padding: 0;
      }
      .workspace .pin.on {
        color: var(--ink);
      }
      .workspace .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        border: 1px solid currentColor;
        border-radius: 4px;
        padding: 0 4px;
      }
      .workspace .badge.valid {
        color: var(--good-text);
      }
      .workspace .badge.warning {
        color: var(--ink-2);
      }
      .workspace .badge.invalid {
        color: var(--critical);
      }
      .workspace .views {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .workspace details.section {
        margin: 10px 0;
      }
      .workspace details.section > summary {
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        margin-bottom: 6px;
      }
      .workspace .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 10px;
      }
      .workspace .grid figure {
        margin: 0;
        cursor: pointer;
      }
      .images article.check {
        background: var(--surface);
        border: 1px solid var(--grid);
        border-radius: 8px;
        padding: 10px 14px;
        margin: 10px 0;
      }
      .images header {
        display: flex;
        gap: 10px;
        align-items: baseline;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .status-badge {
        font-size: 11px;
        font-weight: 700;
        border: 1px solid currentColor;
        border-radius: 4px;
        padding: 0 6px;
        text-transform: uppercase;
        color: var(--ink-2);
      }
      .status-badge.changed,
      .status-badge.error,
      .status-badge.timeout {
        color: var(--critical);
      }
      .status-badge.pass {
        color: var(--good-text);
      }
      .images .viewer {
        margin: 8px 0;
      }
      .images .side {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 8px;
      }
      .images figure {
        margin: 0;
      }
      .images img {
        width: 100%;
        display: block;
        border-radius: 4px;
        border: 1px solid var(--grid);
      }
      .images figcaption {
        font-size: 12px;
        color: var(--ink-2);
      }
      .images .stack {
        position: relative;
      }
      .images .stack .top {
        position: absolute;
        inset: 0;
        clip-path: inset(0 0 0 50%);
      }
      .images .swipe input {
        width: 100%;
      }
      .images .flicker img,
      .images .diff img,
      .images .stack {
        max-width: 960px;
      }
      .images form.review {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .images form.review input {
        min-width: 240px;
      }
      .scene-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 10px;
      }
      .scene-card {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-start;
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--grid);
        border-radius: 8px;
        padding: 10px 12px;
        cursor: pointer;
        font: inherit;
        color: var(--ink);
      }
      .scene-card:hover,
      .scene-card:focus-visible {
        border-color: var(--ink-2);
      }
      .scene-card .title {
        font-weight: 600;
      }
      .scene-page h3 {
        margin: 18px 0 6px;
      }
      .scene-page .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 10px;
      }
      .scene-page .row-actions {
        display: flex;
        gap: 8px;
      }
      .film-run {
        margin: 8px 0 14px;
      }
      .film-frames {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 8px;
      }
      .film-frames figure {
        margin: 0;
      }
      .film-frames img {
        width: 100%;
        border-radius: 4px;
        border: 1px solid var(--grid);
        display: block;
      }
      .film-frames figcaption {
        font-size: 12px;
        color: var(--ink-2);
      }
      table.kv th {
        text-align: left;
        font-weight: normal;
        color: var(--ink-2);
        padding: 2px 12px 2px 0;
      }
      .segmented {
        display: inline-flex;
        border: 1px solid var(--grid);
        border-radius: 6px;
        overflow: hidden;
      }
      .segmented button {
        border: 0;
        border-radius: 0;
        margin: 0;
      }
      .segmented button[aria-checked="true"] {
        background: var(--ink);
        color: var(--surface);
      }
      .alerts article.alert {
        background: var(--surface);
        border: 1px solid var(--grid);
        border-left: 4px solid var(--neutral);
        border-radius: 8px;
        padding: 10px 14px;
        margin: 10px 0;
      }
      .alerts article.regression {
        border-left-color: var(--critical);
      }
      .alerts article.improvement {
        border-left-color: var(--good);
      }
      .alerts header {
        display: flex;
        gap: 10px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .alerts .kind {
        font-weight: 700;
        font-size: 12px;
      }
      .alerts .regression .kind {
        color: var(--critical);
      }
      .alerts .improvement .kind {
        color: var(--good-text);
      }
      .alerts .range {
        color: var(--ink-2);
        margin: 4px 0;
      }
      .alerts .body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 12px;
        align-items: start;
      }
      @media (max-width: 860px) {
        .alerts .body {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .alerts .chart figure {
        margin: 0;
      }
      .alerts form.triage {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .alerts form.triage label {
        display: flex;
        flex-direction: column;
        gap: 2px;
        color: var(--ink-2);
        font-size: 12px;
      }
      .alerts form.triage .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      nav {
        display: flex;
        gap: 4px;
      }
      nav button {
        background: none;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 4px 10px;
        color: var(--ink-2);
        font: inherit;
        cursor: pointer;
      }
      nav button[aria-selected="true"] {
        border-color: var(--grid);
        background: var(--surface);
        color: var(--ink);
        font-weight: 600;
      }
      .where {
        color: var(--muted);
        font-size: 12px;
        margin: 4px 0 12px;
      }
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin: 8px 0 12px;
        color: var(--ink-2);
      }
      select,
      input[type="text"] {
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--grid);
        border-radius: 6px;
        padding: 3px 8px;
        font: inherit;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid var(--grid);
        border-radius: 999px;
        padding: 2px 10px;
        background: var(--surface);
        cursor: pointer;
        user-select: none;
        color: var(--ink-2);
      }
      .chip[aria-pressed="true"] {
        color: var(--ink);
        border-color: var(--ink-2);
        font-weight: 600;
      }
      table.log {
        border-collapse: collapse;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--grid);
        border-radius: 8px;
        font-variant-numeric: tabular-nums;
      }
      table.log th,
      table.log td {
        padding: 6px 10px;
        border-bottom: 1px solid var(--grid);
        text-align: left;
        vertical-align: top;
      }
      table.log th {
        color: var(--ink-2);
        font-weight: normal;
      }
      table.log td.num {
        text-align: right;
      }
      .muted {
        color: var(--muted);
      }
      .better {
        color: var(--good-text);
      }
      .worse {
        color: var(--critical);
      }
      iframe {
        width: 100%;
        height: calc(100vh - 150px);
        border: 1px solid var(--grid);
        border-radius: 8px;
        background: var(--surface);
      }
      .empty {
        color: var(--muted);
        padding: 24px;
        background: var(--surface);
        border: 1px dashed var(--grid);
        border-radius: 8px;
      }
      button.link {
        background: none;
        border: none;
        color: var(--series-1);
        cursor: pointer;
        font: inherit;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div class="app viz">
      <header>
        <h1>
          Dyno <span class="tagline">benchmark tracking for CesiumJS</span>
        </h1>
        <nav>
          <button data-tab="workspace">Workspace</button>
          <button data-tab="alerts">Alerts</button>
          <button data-tab="scenes">Scenes</button>
          <button data-tab="images">Images</button>
          <button data-tab="log">Runs</button>
          <button data-tab="compare">Compare</button>
          <button data-tab="report">Report</button>
          <button data-tab="explore">Explorer</button>
        </nav>
      </header>
      <div class="where" id="where"></div>
      <main id="main"></main>
    </div>
    <script type="module" src="./results.ts"></script>
  </body>
</html>
