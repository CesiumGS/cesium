<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CesiumJS 2.0 PoC</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --panel: #131824;
        --text: #d7dce6;
        --muted: #8a93a6;
        --accent: #f2c14e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      body {
        display: grid;
        grid-template-columns: 1fr 340px;
        height: 100vh;
      }
      #main {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      aside {
        background: var(--panel);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: auto;
      }
      aside h2 {
        margin: 4px 0 0;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      #second {
        width: 100%;
        aspect-ratio: 4 / 3;
        display: block;
        border-radius: 6px;
        touch-action: none;
      }
      #capture-img {
        width: 100%;
        border-radius: 6px;
        min-height: 40px;
        background: #000;
      }
      button {
        background: #222a3a;
        color: var(--text);
        border: 1px solid #2f3a50;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        color: var(--muted);
        font:
          12px/1.5 ui-monospace,
          monospace;
      }
      .hint {
        color: var(--muted);
      }
      #error {
        color: #ff7b72;
      }
    </style>
  </head>
  <body>
    <canvas id="main"></canvas>
    <aside>
      <div id="error"></div>
      <h2>Stats</h2>
      <pre id="stats">starting…</pre>
      <h2>Pick</h2>
      <pre id="pick">click the main view</pre>
      <h2>Second canvas (independent view)</h2>
      <canvas id="second"></canvas>
      <h2>Offscreen view</h2>
      <button id="capture">Capture main camera offscreen</button>
      <img id="capture-img" alt="offscreen capture" />
      <p class="hint">
        Main canvas: drag to orbit, wheel to zoom. Top-right inset is a linked
        overview (follow + footprint) — dragging inside it moves the main
        camera.
      </p>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
