  <g font-size="13" fill="#1f2328">
    <text x="772" y="44" font-size="16" font-weight="700">Stop 3 at 1 device pixel</text>
    <g transform="translate(772 70)" fill="#4a4f57">
      <text font-weight="600" fill="#1f2328">The target for 6b (ruling F30)</text>
      <text y="18">Every line is WebGPU line-list: 1 device pixel,</text>
      <text y="34">no halo, no glow. Hierarchy is color strength.</text>
      <text y="64" font-weight="600" fill="#1f2328">Camera</text>
      <text y="82">Over the grid's centre, 180 km range, 55° tilt,</text>
      <text y="98">heading 0°: the grid fills about 70% of the view.</text>
      <text y="128" font-weight="600" fill="#1f2328">The darker ground</text>
      <text y="146">viewer.view.exposure = { eye: true,</text>
      <text y="162">compensation: −0.6 }, eased in over the flight:</text>
      <text y="178">the lit globe dims to ≈ 0.66×; the unlit lines,</text>
      <text y="194">added after exposure, stay at full strength.</text>
      <text y="210">Restored when the stop ends.</text>
      <text y="240" font-weight="600" fill="#1f2328">Lines</text>
      <text y="258">Major (10 km): engineering rose, alpha 1. Minor</text>
      <text y="274">(2 km) at alpha 0.6, only under 60 km range.</text>
      <text y="290">True north: Earth-fixed cyan, alpha 0.6, dashed as</text>
      <text y="306">world-space segments (line-list can't dash).</text>
      <text y="336" font-weight="600" fill="#1f2328">Labels</text>
      <text y="354">HTML in the HUD host: body-sm 12 px, 600, white</text>
      <text y="370">or the family tone, with a 1.5 px dark text halo.</text>
      <text y="400" font-weight="600" fill="#1f2328">The convergence</text>
      <text y="418">Real: −0° 39′ at the grid's west edge, about</text>
      <text y="434">1 px over the view's height at this range. The</text>
      <text y="450">mock leans it ×20 to show the idea; the caption</text>
      <text y="466">and label carry the number. 6b may add a ×10</text>
      <text y="482">exaggeration control, labelled, as R4 does for</text>
      <text y="498">the frame bias, if the real lean doesn't read.</text>
    </g>
  </g>
</svg>
