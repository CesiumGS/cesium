<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="Inter, system-ui, sans-serif">
  <title>Frames explorer: how overlays are drawn, at 1 px (design mock)</title>
  <defs>
    <pattern id="imagery" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#c9b893"/><path d="M0 30 Q10 22 20 28 T40 26 V40 H0z" fill="#b8a57c"/><circle cx="30" cy="10" r="6" fill="#d9cfb2"/>
    </pattern>
  </defs>
  <rect width="1120" height="760" fill="#f4f5f7"/>
  <g font-size="13" fill="#1f2328">
    <text x="24" y="36" font-size="16" font-weight="700">How overlays are drawn on the globe: 1 device pixel (ruling F30)</text>

    <!-- A. Triad anatomy: meshes -->
    <g transform="translate(24 60)">
      <rect width="340" height="300" rx="8" fill="#03050a"/>
      <text x="12" y="22" font-size="12" font-weight="600" fill="#fff">A. A triad: meshes, not lines</text>
      <g transform="translate(120 190)">
        <polygon points="0,-1.4 104,15.6 104,18.4 0,1.4" fill="#fc5855"/><polygon points="102,10 122,20 100,24" fill="#fc5855"/>
        <polygon points="-1.4,0 17,-96 20,-95.5 1.4,0" fill="#5ad664"/><polygon points="12,-94 22,-112 26,-92" fill="#5ad664"/>
        <polygon points="-1,-1 -50,-46 -48,-48 1,1" fill="#5d97f7"/><polygon points="-44,-52 -62,-58 -54,-40" fill="#5d97f7"/>
        <circle r="4" fill="#bfc8d4" stroke="#000" stroke-width="1"/>
      </g>
      <g font-size="11" font-weight="500" stroke="#000" stroke-width="3" stroke-opacity="0.8" paint-order="stroke">
        <text x="246" y="216" fill="#fc5855">x</text><text x="144" y="74" fill="#5ad664">y</text><text x="50" y="132" fill="#5d97f7">z</text>
        <text x="132" y="212" font-size="12" font-weight="600" fill="#bfc8d4">MOON_PA</text>
      </g>
      <g font-size="11" fill="#c3cad6">
        <text x="12" y="250">Shaft: a box mesh 1.5% as wide as it is long (≈ 2 px);</text>
        <text x="12" y="266">head: an 8-sided cone, 10% of the length. Unlit.</text>
        <text x="12" y="282">Length 6% of the camera's distance, 2 m–2,000 km (R4).</text>
      </g>
    </g>
    <g transform="translate(380 60)" font-size="12" fill="#4a4f57">
      <text font-weight="600" fill="#1f2328">Triads</text>
      <text y="18">Shafts and heads are meshes (createBox and a small</text>
      <text y="34">cone MeshData), so the triad keeps its weight and arrow</text>
      <text y="50">at no engine cost while lines stay 1 px.</text>
      <text y="72">Axes red, green, blue for x, y, z. Axis letters at the</text>
      <text y="88">tips: caption 11 px, 500. The frame's name: body-sm</text>
      <text y="104">12 px, 600, in its family's on-dark tone, 12 px right and</text>
      <text y="120">down of the origin, with a 1.5 px dark text halo (labels</text>
      <text y="136">are HTML, so they keep a halo).</text>
      <text y="158">Geocentric frames (ITRF, GCRF, EME2000) draw at</text>
      <text y="174">1.5 Earth radii, through the globe at alpha 0.4.</text>
      <text y="196">Other triads are depth-tested against the globe and</text>
      <text y="212">terrain: a site's triad hides behind a hill.</text>
    </g>

    <!-- B. Lines at 1 px -->
    <g transform="translate(24 380)">
      <rect width="170" height="170" fill="url(#imagery)"/>
      <rect x="170" width="170" height="170" fill="url(#imagery)"/>
      <rect x="170" width="170" height="170" fill="#000" opacity="0.34"/>
      <text x="12" y="20" font-size="11" font-weight="600" fill="#1f2328">B. Imagery as is</text>
      <text x="182" y="20" font-size="11" font-weight="600" fill="#fff">Dimmed: exposure −0.6</text>
      <g fill="none" stroke-width="1">
        <path d="M14 56 H158 M184 56 H328" stroke="#f07ec2"/>
        <path d="M14 92 H158 M184 92 H328" stroke="#f07ec2" stroke-dasharray="7 4"/>
        <path d="M14 126 H158 M184 126 H328" stroke="#3bcddc" stroke-opacity="0.6" stroke-dasharray="5 3"/>
        <path d="M14 156 H158 M184 156 H328" stroke="#f8bfe1"/>
      </g>
      <g font-size="10" fill="#1f2328" font-weight="600"><text x="14" y="48">primary: full tone</text><text x="14" y="84">rigid: full, dashed segments</text><text x="14" y="118">true north: alpha 0.6</text><text x="14" y="148">selected: tint (50% white)</text></g>
    </g>
    <g transform="translate(380 380)" font-size="12" fill="#4a4f57">
      <text font-weight="600" fill="#1f2328">Lines: 1 device pixel, hierarchy by strength</text>
      <text y="18">Primary (a grid's major lines, the exact line, Orion's</text>
      <text y="34">path): the full on-dark family tone. The rigid line: full,</text>
      <text y="50">dashed as world-space segments (line-list can't dash).</text>
      <text y="66">Secondary (minor grid, true north, Tissot): alpha 0.6.</text>
      <text y="82">Selected: a lighter tint, the tone mixed 50% with white;</text>
      <text y="98">everything else at alpha 0.35.</text>
      <text y="120">No halos. Under an engineering subject the imagery is</text>
      <text y="136">dimmed instead: viewer.view.exposure's compensation to</text>
      <text y="152">−0.6 (≈ 0.66×). Overlays are unlit, added after exposure,</text>
      <text y="168">so they keep full strength over the darker ground.</text>
    </g>

    <!-- C. Selection by contrast -->
    <g transform="translate(760 60)">
      <rect width="336" height="300" rx="8" fill="#03050a"/>
      <text x="12" y="22" font-size="12" font-weight="600" fill="#fff">C. A selection: tint and dimming</text>
      <g opacity="0.35">
        <polygon points="60,229 100,235 100,237 60,231" fill="#fc5855"/><polygon points="59,230 63,196 65,196 61,230" fill="#5ad664"/><polygon points="59,229 42,210 43,209 61,229" fill="#5d97f7"/>
        <circle cx="60" cy="230" r="4" fill="#3bcddc"/>
      </g>
      <g>
        <polygon points="170,199 228,207 228,209 170,201" fill="#fc5855"/><polygon points="226,203 238,208 226,213" fill="#fc5855"/>
        <polygon points="169,200 175,142 177,142 171,200" fill="#5ad664"/><polygon points="171,144 176,130 180,145" fill="#5ad664"/>
        <polygon points="169,199 142,173 143,172 171,201" fill="#5d97f7"/><polygon points="138,176 134,166 145,170" fill="#5d97f7"/>
        <circle cx="170" cy="200" r="4" fill="#b298f9" stroke="#000"/>
      </g>
      <g>
        <polygon points="270,109 318,115 318,117 270,111" fill="#fdabaa"/><polygon points="316,111 330,116 316,121" fill="#fdabaa"/>
        <polygon points="269,110 274,60 276,60 271,110" fill="#acebb1"/><polygon points="270,62 275,48 280,63" fill="#acebb1"/>
        <polygon points="269,109 244,86 245,85 271,111" fill="#aecbfb"/><polygon points="240,89 236,79 247,83" fill="#aecbfb"/>
        <circle cx="270" cy="110" r="5" fill="#fff" stroke="#000"/>
      </g>
      <path d="M60 230 C110 215 140 205 170 200 C210 170 240 140 270 110" fill="none" stroke="#bfc8d4" stroke-width="1" stroke-dasharray="2 5"/>
      <g font-size="12" font-weight="600" stroke="#000" stroke-width="3" stroke-opacity="0.8" paint-order="stroke">
        <text x="182" y="222" fill="#b298f9">MOON_ICRF</text><text x="236" y="140" fill="#fff">MOON_PA</text>
      </g>
      <g font-size="11" fill="#c3cad6"><text x="12" y="262">Selected: shafts tinted (axis color + 50% white), label</text><text x="12" y="278">white. On its path: full. Others: alpha 0.35, no label.</text><text x="12" y="294">A dotted 1 px path joins the walk's origins, root first.</text></g>
    </g>
    <g transform="translate(760 380)" font-size="12" fill="#4a4f57">
      <text font-weight="600" fill="#1f2328">Selection by contrast, not width (R14)</text>
      <text y="18">A frame: its triad tinted, its label white; the triads on</text>
      <text y="34">its walk's path full; a dotted 1 px line (world-space</text>
      <text y="50">segments) joins their origins, drawn root first with the</text>
      <text y="66">walk's 90 ms stagger; every other triad at alpha 0.35,</text>
      <text y="82">labels hidden. No camera move.</text>
      <text y="104">A result: its overlay's lines tinted, everything else at</text>
      <text y="120">alpha 0.35, the imagery dimmed if it's engineering; the</text>
      <text y="136">camera flies to its site.</text>
      <text y="158">Labels never overlap: by priority (selected, on the</text>
      <text y="174">path, sites, the rest), a colliding label is hidden;</text>
      <text y="190">labels fade out below 24 px between origins.</text>
    </g>

    <!-- D. Legend -->
    <g transform="translate(24 572)">
      <text font-size="12" font-weight="600">D. The legend, compact and unfolded (dark in either scheme)</text>
      <g transform="translate(0 14)">
        <rect width="240" height="84" rx="8" fill="#26282c"/>
        <text x="12" y="20" font-size="12" font-weight="600" fill="#fff">On the globe</text>
        <line x1="12" y1="38" x2="30" y2="38" stroke="#f07ec2" stroke-width="1.5"/><text x="38" y="42" font-size="11" font-weight="500" fill="#fff">Design grid</text><text x="112" y="42" font-size="11" fill="#c3cad6">±2.0 m (1σ): the WGS…</text>
        <line x1="12" y1="58" x2="30" y2="58" stroke="#f07ec2" stroke-width="1.5" stroke-dasharray="4 3"/><text x="38" y="62" font-size="11" font-weight="500" fill="#fff">Rigid vs exact</text><text x="122" y="62" font-size="11" fill="#c3cad6">sag 31.2 m at 20 km…</text>
      </g>
      <g transform="translate(264 14)">
        <rect width="240" height="150" rx="8" fill="#26282c"/>
        <text x="12" y="20" font-size="12" font-weight="600" fill="#fff">On the globe</text>
        <line x1="12" y1="38" x2="30" y2="38" stroke="#f07ec2" stroke-width="1.5"/><text x="38" y="42" font-size="11" font-weight="500" fill="#fff">California design grid, with true north</text>
        <text x="38" y="58" font-size="11" fill="#c3cad6">±2.0 m (1σ): the WGS 84 ensemble;</text><text x="38" y="72" font-size="11" fill="#c3cad6">round trip ≤ 3.4 nm</text>
        <line x1="12" y1="90" x2="30" y2="90" stroke="#f07ec2" stroke-width="1.5" stroke-dasharray="4 3"/><text x="38" y="94" font-size="11" font-weight="500" fill="#fff">Rigid and exact 20 km line</text>
        <text x="38" y="110" font-size="11" fill="#c3cad6">sag 31.2 m at 20 km (geometry, exact)</text>
        <line x1="12" y1="124" x2="228" y2="124" stroke="#3e4250"/><text x="12" y="140" font-size="10" fill="#c3cad6">Triads at 6% of the camera's distance.</text>
      </g>
    </g>
    <g transform="translate(560 586)" font-size="12" fill="#4a4f57">
      <text font-weight="600" fill="#1f2328">Legend</text>
      <text y="18">Lists only overlays that are drawn (not ones waiting</text>
      <text y="34">for data: those show in the panel). Appears when the</text>
      <text y="50">first overlay draws; gone when none is. Compact by</text>
      <text y="66">default, 240 px: one line each, the accuracy ellipsized,</text>
      <text y="82">in full on hover and focus; unfolded, full lines and the</text>
      <text y="98">triad note. Line keys match the globe: solid, dashed</text>
      <text y="114">(rigid), dotted (site grid, round trips). Always dark,</text>
      <text y="130">like the viewer's own widgets, in either scheme.</text>
    </g>
  </g>
</svg>
