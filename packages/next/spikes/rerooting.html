<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Re-rooting Checks</title>
  </head>
  <body>
    <!-- Plan 5a's re-rooting checks: open with ?bench and call runRerooting(). -->
    <div id="root"></div>
    <script>
      // Check 4 counts modules by resource timing: room for every entry
      // (250 by default; a full buffer drops later entries silently), set
      // before any module loads, and a record of whether it filled.
      performance.setResourceTimingBufferSize(100000);
      performance.addEventListener("resourcetimingbufferfull", () => {
        globalThis.resourceTimingFull = true;
      });
    </script>
    <script type="module">
      import { harness } from "./rerooting.ts";
      import { standalone } from "../lab/harness.ts";
      standalone(harness, "runRerooting");
    </script>
  </body>
</html>
