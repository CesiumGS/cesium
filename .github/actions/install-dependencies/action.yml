name: install dependencies
description: installs Node.js and npm 11, then runs npm install
inputs:
  node-version:
    description: Node.js version to install
    default: "24"
  working-directory:
    description: directory to run npm install in
    default: "."
runs:
  using: "composite"
  steps:
    - name: install node ${{ inputs.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        # By default, `actions/setup-node` enables caching if `devEngines.packageManager`
        # is specified in `package.json`. Caching fails without `package-lock.json`,
        # so disable the cache explicitly. See #14016.
        package-manager-cache: false
    - name: install npm 11
      run: npm install -g npm@11
      shell: bash
    - name: npm install
      working-directory: ${{ inputs.working-directory }}
      run: npm install
      shell: bash
