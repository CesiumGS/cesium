# The release pipeline (CS-613; CS-888, CS-889): docs/design/repository-build-and-release.md,
# "Releases". A release record is the change `npm run release:version` writes
# (every package's new version and CHANGELOG.md section, the changesets it
# consumed); when it merges into the 2.0 branch, this stages every package
# at that version, in lockstep, through npm's trusted publishing: the job's
# OIDC identity, no npm token anywhere, provenance attached by npm. Nothing
# is live until a maintainer approves each staged version on npm with 2FA,
# the umbrella last. The GitHub release is created as a draft, with the
# combined release notes, for the owner to publish after the approvals.
#
# Only `publish` holds `id-token: write`, and it runs no install and no
# build: `verify` builds, tests, packs and checks the tarballs, and
# `publish` stages exactly those, their SHA-256 sums checked on arrival.
#
# A push can hold several commits (a bundle pushed from another machine, a
# merge made by `git pull`, a force push), so `record` judges every commit
# the push adds and names the record's; every later job works on that
# commit, not on the push's head (GITHUB_SHA).
#
# It runs only after the owner has set up the `npm` environment (its
# required reviewer, its branch policy (the 2.0 branch alone) and the CESIUM_RELEASE_GATE
# variable) and npm's trusted publisher for each package (the design's
# checklist, under "Releases"). Until then `publish` refuses at the gate,
# and nothing is sent.
name: release

on:
  push:
    branches: [cesium-2.0-webgpu-poc]
    paths:
      - "packages/*/package.json"

permissions:
  contents: read

# No workflow-wide concurrency group: GitHub cancels a pending run in a
# group when a newer one queues, so a later push could cancel a record's
# run while it waits. Each job after `record` takes a group keyed by the
# record's commit instead, which only a rerun of that record shares.

env:
  NODE_VERSION: "24"
  CI: "true"

jobs:
  # Whether this push holds a release record (scripts/release/record.mjs):
  # a commit the push adds (on any parent's side), judged against its first
  # parent, that is exactly what `npm run release:version` writes, at a
  # version with no `v<version>` tag and not on npm yet. It fails the run,
  # never ends green, when a version could be lost: two records in one
  # push, a commit that moves the version up without being one, or a head
  # whose version went up from the before commit's with no record found.
  # No install: the script needs only Node.
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.record.outputs.release }}
      version: ${{ steps.record.outputs.version }}
      sha: ${{ steps.record.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # A force push's old tip is on no branch, so the clone lacks it; fetch
      # it by its id (a read), so the record can still be judged against it.
      - name: The push's before commit
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$BEFORE" in
            "" | *[!0-9a-f]* | 0000000000000000000000000000000000000000) exit 0 ;;
          esac
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --no-tags --quiet origin "$BEFORE" || echo "the before commit $BEFORE couldn't be fetched"
      - id: record
        name: The release record
        env:
          BEFORE: ${{ github.event.before }}
        run: node scripts/release/record.mjs --before "$BEFORE" --head HEAD

  # The full tier again on the record's commit, so the release never rests
  # on another workflow's result; then the tarballs, checked, and the
  # GitHub release's files, each set with its SHA-256 sums as an output.
  # No `id-token` and no write token here.
  verify:
    needs: record
    if: needs.record.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: release-verify-${{ needs.record.outputs.sha || github.run_id }}
      cancel-in-progress: false
    outputs:
      tarballs-sha256: ${{ steps.pack.outputs.sha256 }}
      files-sha256: ${{ steps.files.outputs.sha256 }}
    steps:
      - name: The record's commit
        env:
          RECORD_SHA: ${{ needs.record.outputs.sha }}
        run: echo "checking out the release record's commit $RECORD_SHA, not the push's head $GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.record.outputs.sha }}
          persist-credentials: false
      # pnpm at the version package.json's packageManager names (CS-1091).
      # It installs only; the packing below and the staging stay npm's.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No dependency cache on the release path.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: The version lines
        run: npm run release:check
      # The suite's bundle test reads the packages' dist/, so the build comes
      # first; the packed checks run below, on the tarballs that are staged.
      - name: Build
        run: npm run build -- --no-checks
      - run: npm test
      - run: npm run check:bundle
      - run: npm run surface -- --check
      - id: pack
        name: Pack every package for staging (the version lines, private, latest, the packed checks)
        run: |
          node scripts/release/stage.mjs --pack "$RUNNER_TEMP/npm"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/npm/release.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - id: files
        name: The release notes and the browser build
        env:
          VERSION: ${{ needs.record.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/github"
          node scripts/release/notes.mjs --version "$VERSION" > "$RUNNER_TEMP/github/notes.md"
          tar -czf "$RUNNER_TEMP/github/cesium-browser-$VERSION.tgz" -C packages/cesium/dist browser
          (cd "$RUNNER_TEMP/github" && sha256sum notes.md "cesium-browser-$VERSION.tgz" > SHA256SUMS)
          echo "sha256=$(sha256sum "$RUNNER_TEMP/github/SHA256SUMS" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      # Named by the version, so a later run can find this one (`publish`'s
      # earlier-runs check).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs-${{ needs.record.outputs.version }}
          path: ${{ runner.temp }}/npm
          if-no-files-found: error
          # 30 days, so they outlast a long wait for the owner's approval.
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release
          path: ${{ runner.temp }}/github
          if-no-files-found: error
          retention-days: 30

  # Stages the checked tarballs, and nothing else runs here: no install, no
  # build, no dependency's code. The `npm` environment's required reviewer
  # (the owner) approves the run before this job starts; npm's trusted
  # publisher for each package names this file and that environment, and
  # allows `npm stage publish` only. scripts/release/stageTarballs.mjs
  # refuses unless the `npm` environment, as the REST API returns it, has a
  # required reviewer and custom branch policies that are the 2.0 branch
  # alone, its CESIUM_RELEASE_GATE is set, and no earlier run of this file
  # (scripts/release/earlierRuns.mjs) staged this version or is staging
  # it; checks release.json against the sum `verify` reported and each
  # tarball against release.json, then stages each in order.
  publish:
    needs: [record, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    concurrency:
      group: release-publish-${{ needs.record.outputs.sha || github.run_id }}
      cancel-in-progress: false
    # `actions: read` for the environment, its branch policies and the
    # earlier runs: GitHub's "Permissions required for fine-grained personal
    # access tokens" lists both environment GETs under "Repository
    # permissions for "Actions"", read (read 2026-11-22).
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: The record's commit
        env:
          RECORD_SHA: ${{ needs.record.outputs.sha }}
        run: echo "checking out the release record's commit $RECORD_SHA, not the push's head $GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.record.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: npm can stage through trusted publishing (11.15.0 or later)
        run: |
          npm --version
          node -e 'const [a,b]=process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && b < 15)) { console.error(`npm ${process.argv[1]} is older than 11.15.0, the first with npm stage publish`); process.exit(1); }' "$(npm --version)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs-${{ needs.record.outputs.version }}
          path: ${{ runner.temp }}/npm
      # The real gate: the environment's own protection and its branch
      # policies, read with the job's token (`actions: read`). A failed read
      # leaves no file, and the stage step refuses.
      - name: The npm environment's protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/npm" > "$RUNNER_TEMP/environment.json" || rm -f "$RUNNER_TEMP/environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/npm/deployment-branch-policies" > "$RUNNER_TEMP/branch-policies.json" || rm -f "$RUNNER_TEMP/branch-policies.json"
      # Every other run of this workflow file, on the 2.0 branch, from a push
      # in this repository, that packed this version, and its publish jobs'
      # states (GETs only, every page read), so a second run for one record
      # refuses before it stages. No other workflow and no fork can name an
      # artifact that counts. Only runs created in the last 35 days count,
      # which bounds the GETs. A failed read, or a list at GitHub's
      # 1,000-result cap, fails this step, and nothing is staged. Artifacts
      # last 30 days; past that, npm refuses a version already staged.
      - name: Earlier runs for this version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.record.outputs.version }}
        run: node scripts/release/earlierRuns.mjs --version "$VERSION" --out "$RUNNER_TEMP/earlier.json"
      - name: Stage every package
        env:
          # A second guard only: `vars.` falls back to a repository's or an
          # organization's variable of this name (the checklist forbids one).
          CESIUM_RELEASE_GATE: ${{ vars.CESIUM_RELEASE_GATE }}
          MANIFEST_SHA256: ${{ needs.verify.outputs.tarballs-sha256 }}
        run: >-
          node scripts/release/stageTarballs.mjs --from "$RUNNER_TEMP/npm"
          --manifest-sha256 "$MANIFEST_SHA256"
          --environment "$RUNNER_TEMP/environment.json"
          --branch-policies "$RUNNER_TEMP/branch-policies.json"
          --earlier "$RUNNER_TEMP/earlier.json"

  # The GitHub release, as a draft: the tag, the combined release notes and
  # the browser build `verify` made, their sums checked on arrival. The only
  # job with `contents: write`, and it runs nothing from the repository.
  github-release:
    needs: [record, verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-github-${{ needs.record.outputs.sha || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release
          path: ${{ runner.temp }}/github
      - name: The files as verify made them
        env:
          SUMS_SHA256: ${{ needs.verify.outputs.files-sha256 }}
        working-directory: ${{ runner.temp }}/github
        run: |
          echo "$SUMS_SHA256  SHA256SUMS" | sha256sum --check --strict -
          sha256sum --check --strict SHA256SUMS
      - name: The draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.record.outputs.version }}
          RECORD_SHA: ${{ needs.record.outputs.sha }}
        working-directory: ${{ runner.temp }}/github
        run: |
          echo "tagging the release record's commit $RECORD_SHA, not the push's head $GITHUB_SHA"
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v$VERSION" \
            --draft $prerelease \
            --target "$RECORD_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md \
            "cesium-browser-$VERSION.tgz"
