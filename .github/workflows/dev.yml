name: dev
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      # These checks are independent of each other, so run them concurrently.
      # Note: as of writing, there is a limit of 10 concurrent background steps.
      - name: lint *.js
        background: true
        run: npm run eslint
      - name: lint *.md
        background: true
        run: npm run markdownlint
      - name: format code
        background: true
        run: npm run prettier-check
      - name: ast-grep test
        background: true
        run: npm exec --package=@ast-grep/cli --offline -- ast-grep test
      - name: ast-grep scan
        background: true
        run: npm exec --package=@ast-grep/cli --offline -- ast-grep scan --context 3
      # build -> tsc is a dependent chain that runs alongside the checks above.
      - name: build
        run: npm run build
      - name: tsc
        run: npm run tsc
      - name: wait for lint checks
        wait-all:
  coverage:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: install node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      - name: build
        run: npm run build
      - name: coverage (firefox)
        run: npm run coverage -- --browsers FirefoxHeadless --webgl-stub --failTaskOnError --suppressPassed
      - name: upload coverage artifacts
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: aws s3 sync ./Build/Coverage s3://cesium-public-builds/cesium/$BRANCH/Build/Coverage --delete --color on
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      - name: release build
        run: npm run make-zip
      - name: release tests (chrome)
        run: npm run test -- --browsers ChromeHeadless --failTaskOnError --webgl-stub --release --suppressPassed
      - name: cloc
        run: npm run cloc
  node-smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - name: install node ${{ matrix.version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.version }}
      - name: npm install
        run: npm install
      - name: release build
        run: npm run build-release
      - name: package cesium module
        run: npm pack &> /dev/null
      - name: package workspace modules
        run: npm pack --workspaces &> /dev/null
      - uses: ./.github/actions/verify-package
