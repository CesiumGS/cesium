# Dependabot reads this file from the default branch only, so each branch's
# updates are an entry here with its `target-branch`.
version: 2
updates:
  # 1.x's workflows, on main.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "main"
  # 2.0's workflows (CS-613; docs/design/repository-build-and-release.md,
  # "CI"): every action is pinned to a full commit SHA with its version in a
  # comment, and these updates move the pin and the comment together, as
  # one grouped change a week, through the merge queue like any change.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "cesium-2.0-webgpu-poc"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  # 2.0's dependencies (CS-894, CS-1091): pnpm-lock.yaml, read through the
  # `npm` ecosystem, which covers pnpm (GitHub's supported-ecosystems page
  # lists pnpm 11, read 2026-11-23). Development tools come as one grouped
  # change a week, runtime dependencies one at a time
  # (docs/design/repository-build-and-release.md, "Installs and the
  # lockfile"). The pinned 1.x, naga-wasm and hitld move only on purpose.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "cesium-2.0-webgpu-poc"
    groups:
      development:
        dependency-type: "development"
        patterns: ["*"]
    ignore:
      - dependency-name: "cesium-1x"
      - dependency-name: "cesium"
      - dependency-name: "naga-wasm"
      - dependency-name: "human-in-the-lead"
    commit-message:
      prefix: "deps"
