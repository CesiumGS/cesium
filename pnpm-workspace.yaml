# The workspace's packages, for pnpm (CS-1091). pnpm doesn't read the
# "workspaces" field of package.json; that field stays for `npm run --workspace`.
packages:
  - "packages/*"
  - "apps/*"
  - "tools/*"
# Overrides, in pnpm's selector form. pnpm takes one parent only
# ("parent>child"), so a rule applies under any parent of that name.
overrides:
  protobufjs: "^8.8.0"
  "onnxruntime-web>protobufjs": "^7.6.4"
# Link a workspace package whose name and version match a plain range
# ("@cesium/core": "2.0.0-poc.0"), as npm does, without "workspace:" ranges.
linkWorkspacePackages: true
# `pnpm run` and `pnpm exec` never install on their own, as `npm run` never
# did: installing is pnpm install's job (worktree setup, CI, by hand).
verifyDepsBeforeRun: false
# Dependencies' install scripts, reviewed (CS-1091). pnpm 11 stops an install
# until each is named here. None runs, as with `--ignore-scripts` in worktree
# setup and CI: esbuild's platform binary comes as an optional dependency,
# onnxruntime-node's script downloads binaries its package doesn't bundle
# (CUDA's, for one), and protobufjs's only checks versions.
allowBuilds:
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
