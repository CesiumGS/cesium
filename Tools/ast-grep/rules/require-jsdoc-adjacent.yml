id: require-jsdoc-adjacent
message: |
  JSDoc comments preceding variable, function, or class declarations must
  not be separated from those declarations by empty lines. If JSDoc is
  unrelated to the declaration that follows, separate the two with
  `// lorem ipsum` or `/** @ignore */` comments.

  This scan cannot identify the exact line of the error. If needed, search for
  this regex in your code editor: \*/\s*\n\s*\n\s*(const|let|function|class)\b

  See: https://github.com/CesiumGS/cesium/issues/13866

  BAD:
  /** @import { A } from "./a.js" */

  const internalVariable = 123;


  GOOD:
  /** @import { A } from "./a.js" */

  /** @ignore */
  const internalVariable = 123;
severity: error
language: JavaScript
files:
  - packages/engine/Source/**/*.js
rule:
  kind: program
  regex: \*/\s*\n\s*\n\s*(const|let|function|class)\b
