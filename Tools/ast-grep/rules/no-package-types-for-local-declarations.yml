id: no-package-types-for-local-declarations
message: >
  Module-scoped declarations annotated with JSDoc are included in type definitions,
  even if they are not exported. Declarations not accessible through exported APIs
  must be explicitly excluded from type definitions with "@ignore" or "@private".
severity: error
language: JavaScript
files:
  - packages/*/Source/**/*.js
rule:
  # Match all declarations at module scope that are preceded immediately by a
  # JSDoc comment. Exclude JSDoc comments containing tags that would exclude
  # the token from generated types, or which generate a types entry unrelated
  # to the declaration (such as @typedef).
  any:
    - {kind: function_declaration, pattern: function $TOKEN}
    - {kind: lexical_declaration, pattern: const $TOKEN = $ARG}
    - {kind: lexical_declaration, pattern: let $TOKEN = $ARG}
    - {kind: class_declaration, pattern: class $TOKEN}
  inside:
    kind: program
  follows:
    kind: comment
    regex: "/\\*\\*"
    not: {regex: "@ignore|@private|@typedef|@import"}
  # Exclude declarations later exported from the module, either explicitly
  # or as part of an Object.freeze(...) call (for enums).
  not:
    precedes:
      kind: export_statement
      has: {kind: identifier, pattern: $TOKEN, stopBy: end}
      stopBy: end
