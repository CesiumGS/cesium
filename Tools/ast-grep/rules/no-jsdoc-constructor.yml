id: no-jsdoc-constructor
message: >
  ES6 class declarations do not require @constructor or @alias tags.
severity: error
language: JavaScript
files:
  - packages/*/Source/**/*.js
rule:
  kind: comment
  pattern: $COMMENT
  regex: "@constructor|@alias"
  precedes:
    kind: class_declaration
transform:
  FIX_1: replace($COMMENT, replace="(?i)\n.*@constructor.*\n( \\*\n)?", by="\n")
  FIX_2: replace($FIX_1, replace="(?i)\n.*@alias.*\n( \\*\n)?", by="\n")
fix: '$FIX_2'
