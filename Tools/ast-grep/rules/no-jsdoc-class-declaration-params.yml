id: no-jsdoc-class-declaration-params
message: >
  JSDoc @param and @exception documentation should be located on the
  constructor, not the class declaration.
severity: error
language: JavaScript
files:
  - packages/*/Source/**/*.js
rule:
  kind: comment
  regex: "(?i)@param|@privateParam|@exception"
  precedes:
    kind: class_declaration
